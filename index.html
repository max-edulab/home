<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Max EduLab 學習遊戲</title>
<meta name="description" content="Max EduLab 的學習遊戲入口：依年級或科目找遊戲，點一下就開始玩。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#5c94fc; --ink:#1b1b2f; --paper:#fffbe8; --brick:#c84c0c; --gold:#fcbc3c; --leaf:#3c9c28; --muted:#6a6a80; --line:#d8d2b8;
  --f-zy:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --f-px:"Press Start 2P",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--f-zy);min-height:100vh}
a{color:inherit}
.bar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;border-bottom:4px solid #000;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.bar-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.home{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:#fff;min-width:0}
.home .px{font-family:var(--f-px);font-size:11px;color:var(--gold);white-space:nowrap}
.home .ttl{font-size:22px;font-weight:900;white-space:nowrap}
.sortbox{position:relative;flex:none}
.sortbtn{display:flex;align-items:center;gap:0;font:inherit;font-size:16px;font-weight:500;color:#2a2a3a;background:#fff;border:1.5px solid #8a8a9a;border-radius:10px;padding:9px 14px 9px 16px;cursor:pointer;min-width:220px}
.sortbtn b{font-weight:500}
.sortbtn .caret{width:0;height:0;margin-left:auto;padding-left:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid #4a4a5a;translate:6px 0}
.sortbtn b{margin-right:18px}
.sortbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sortmenu{position:absolute;right:0;top:calc(100% + 6px);min-width:100%;margin:0;padding:8px 0;list-style:none;background:#fff;color:#2a2a3a;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.sortmenu li{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:10px 18px;font-size:16px;cursor:pointer}
.sortmenu li:hover,.sortmenu li:focus{background:#f0f2f8;outline:none}
.sortmenu li[aria-selected="true"]{font-weight:900}
.sortmenu li[aria-selected="true"]::after{content:"";width:12px;height:6px;border-left:2.5px solid #2c64d8;border-bottom:2.5px solid #2c64d8;rotate:-45deg;translate:0 -3px}
.wrap{max-width:1240px;margin:0 auto;padding:16px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}

/* ---------- 左邊：搜尋、排序、分組 ---------- */
.side{position:sticky;top:80px;display:flex;flex-direction:column;gap:14px;background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.25);padding:16px}
.logo{margin:0;font-size:22px;font-weight:900;line-height:1.3}
.logo .px{display:block;font-family:var(--f-px);font-size:13px;color:var(--brick);letter-spacing:.04em;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:900;color:var(--muted)}
.search{width:100%;font:inherit;font-size:16px;font-weight:700;padding:9px 10px;border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:0}
.search:focus,select:focus{outline:3px solid var(--gold);outline-offset:1px}
select{width:100%;font:inherit;font-size:16px;font-weight:700;padding:8px 10px;border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:0;cursor:pointer}
.groups{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.groups label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;padding:6px 8px;border:2px solid transparent;cursor:pointer;user-select:none}
.groups label:hover{border-color:var(--ink);background:#fff3b0}
.groups input{appearance:none;flex:none;width:22px;height:22px;margin:0;border:3px solid var(--ink);background:#fff;cursor:pointer;display:grid;place-items:center}
.groups input:checked{background:var(--leaf)}
.groups input:checked::after{content:"";width:9px;height:5px;border-left:3px solid #fff;border-bottom:3px solid #fff;rotate:-45deg;translate:0 -2px}
.groups input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.groups label:has(input:not(:checked)) span{opacity:.5}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ghead b{font-size:14px;font-weight:900;color:var(--muted)}
.ghead .all{display:flex;gap:6px}
.ghead button{font:inherit;font-size:12px;font-weight:700;background:#fff;color:var(--ink);border:2px solid var(--ink);padding:1px 6px;cursor:pointer}
.ghead button:hover{background:#fff3b0}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}

/* ---------- 右邊：分組的遊戲卡 ---------- */
.main{display:flex;flex-direction:column;gap:22px;min-width:0}
.group h2{margin:0 0 10px;display:inline-flex;align-items:center;gap:8px;font-size:20px;font-weight:900;color:#fff;background:var(--ink);padding:4px 12px;scroll-margin-top:84px}
.group h2 .n{font-family:var(--f-px);font-size:10px;color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--paper);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);text-decoration:none;cursor:pointer;transition:transform .08s;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--ink);background:#fff8d4}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.card:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
/* 遊戲畫面預覽：六張圖疊在一起，每兩秒淡入下一張 */
.pv{position:relative;aspect-ratio:16/10;max-width:100%;background:var(--ink);border-bottom:4px solid var(--ink);overflow:hidden}
.pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.pv img.on{opacity:1}
.pv .dots{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:5px}
.pv .dots i{width:7px;height:7px;background:rgba(255,255,255,.5);border:1.5px solid var(--ink)}
.pv .dots i.on{background:var(--gold)}
.card .body{display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px}
.card h3{margin:0;font-size:20px;font-weight:900;line-height:1.25;display:flex;align-items:center;gap:8px}
.card h3 .ico{font-size:22px}
.card p{margin:0;font-size:14px;line-height:1.5;color:#3a3a50}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;font-weight:700;padding:2px 7px;border:2px solid var(--ink);background:#fff;white-space:nowrap}
.chip.stage{background:#ffe08a}
.chip.subject{background:#bfe8c0}
.chip mark{background:#ffd23c;color:inherit;padding:0}
/* 從遊戲不小心按回主畫面時，上方出現「回到剛才的遊戲」 */
.back{max-width:1240px;margin:12px auto 0;padding:0 16px}
.back a{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--gold);color:var(--ink);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:10px 14px;font-weight:900;font-size:17px;text-decoration:none}
.back a:hover{background:#ffd76a}
.back a:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.back small{font-weight:700;font-size:13px;color:#5a4a20}
.back kbd{font:inherit;font-family:var(--f-px);font-size:10px;background:#fff;border:2px solid var(--ink);padding:2px 5px}
.none{background:var(--paper);border:4px solid var(--ink);padding:24px;font-weight:700;text-align:center}
mark{background:#ffd23c;color:inherit}

@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .home .px{display:none}
  .home .ttl{font-size:18px}
  .sortbtn{min-width:0;font-size:15px;padding:8px 12px}
  .groups{flex-direction:row;flex-wrap:wrap}
  .cards{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.card:focus-visible .pv img.on,.card:hover .pv img.on{filter:brightness(1.05)}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="home" href="./"><span class="px">MAX EDULAB</span><span class="ttl">Home 主畫面</span></a>
    <div class="sortbox" id="sortbox">
      <button class="sortbtn" id="sortBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="sortMenu">排序方式：<b id="sortLbl">依年級</b><span class="caret" aria-hidden="true"></span></button>
      <ul class="sortmenu" id="sortMenu" role="listbox" aria-label="排序方式" hidden>
        <li role="option" data-v="stage" tabindex="-1">依年級</li>
        <li role="option" data-v="subject" tabindex="-1">依科目</li>
      </ul>
    </div>
  </div>
</header>
<div class="back" id="back" hidden></div>
<div class="wrap">
  <aside class="side">
    <h1 class="logo">學習遊戲</h1>
    <div class="field">
      <label for="q">搜尋</label>
      <input id="q" class="search" type="search" placeholder="遊戲名稱、年級、科目、單元…" autocomplete="off">
    </div>
    <div class="field">
      <div class="ghead"><b id="gTitle">年級</b><span class="all"><button type="button" id="gAll">全選</button><button type="button" id="gNone">全不選</button></span></div>
      <ul class="groups" id="groups"></ul>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
// 遊戲清單：url 是 GitHub Pages 上的網址；labels 是讀不到遊戲裡的 meta 時的備用標籤
// 新增遊戲：在這裡加一筆，並在那個遊戲的 index.html <head> 加上 edulab:* 的 meta；預覽圖放在 previews/{pv}/1.jpg～6.jpg，brief 是卡片上的一句簡介
const GAMES = [
  { url:'https://max-edulab.github.io/grade1-MandarinChinese-Bopomofo/', folder:'grade1/chinese/bopomofo', pv:'bopomofo', brief:'在小鎮裡幫大家的忙，練注音和拼音',
    labels:{ title:'ㄅㄆㄇ心愛小鎮', stage:'國小一年級', subject:'國語', icon:'🏡', tags:'注音,ㄅㄆㄇ,拼音,聲調', desc:'在小鎮裡幫大家解決問題，練習注音符號、拼音和聲調。' } },
  { url:'https://max-edulab.github.io/grade1-MandarinChinese-ZhuyinChallenge-Sem1/', folder:'grade1/chinese/zhuyin-challenge', pv:'zhuyin', brief:'看圖選注音，分清容易搞混的音',
    labels:{ title:'注音大挑戰', stage:'國小一年級', subject:'國語', icon:'📝', tags:'注音,聲調,拼音,ㄣㄥ,ㄢㄤ,ㄌㄉㄋ,ㄈㄏ,翹舌,辨音,上學期', desc:'看圖選出正確的注音，專門練習容易混淆的聲調和音；答對會唸出詞，還有給家長看的錯題紀錄。' } },
  { url:'https://max-edulab.github.io/grade1-Math123-Sec1/', folder:'grade1/math/math123-sec1', pv:'math123', brief:'闖六座小島：數數、形狀、時鐘',
    labels:{ title:'123冒險島', stage:'國小一年級', subject:'數學', icon:'🔢', tags:'數數,湊十,比多少,平面圖形,時鐘,順序', desc:'走遍六座冒險島，練習數數、湊十、比較、形狀、時鐘和數的順序。' } },
  { url:'https://max-edulab.github.io/grade6-MandarinChinese-Idioms-Sem1/', folder:'grade6/chinese/idioms-sem1', pv:'idioms', brief:'和小美比賽出成語牌，還能抓錯',
    labels:{ title:'成語小學堂', stage:'國小六年級', subject:'國語', icon:'📜', tags:'成語,近義詞,反義詞,成語填空,上學期', desc:'兩個人一起玩成語牌：看題目出意思相近、相反或填進句子的成語，還能抓別人出錯的牌，先拿到 50 分就贏。' } },
  { url:'https://max-edulab.github.io/grade6-SocialStudies-Taiwan-Sem1/', folder:'grade6/social/taiwan-sem1', pv:'social', brief:'六上社會闖關，還有社會魔考',
    labels:{ title:'社會任務', stage:'國小六年級', subject:'社會', icon:'🚀', tags:'民主發展,二二八,戒嚴,美麗島,憲法,權利義務,五院,地方自治,少子化,性別平等,宗教,原住民族,上學期', desc:'臺灣民主、憲法權利、政府運作、社會變遷、性別平等與宗教文化的闖關任務：每次 20 題、答錯附詳解，還有會跑來跑去的小夥伴和知識卡。' } },
  { url:'https://max-edulab.github.io/MandarinChinese-ReadingLiteracy/', folder:'reading/literacy', pv:'reading', brief:'讀一篇短文、答 5 題，練閱讀理解',
    labels:{ title:'閱讀素養', stage:'國小六年級', subject:'國語', icon:'📚', tags:'閱讀理解,生詞,自然,科學,搞笑,文學', desc:'依年級分成 Lv1～Lv6，選喜歡的主題讀約 500 字的原創文章，生詞點一下就有解釋，讀完回答 5 題閱讀理解。' } }
];
const PV_N = 6, PV_MS = 2000;   // 每個遊戲 6 張預覽圖，每 2 秒換一張
// 年級和科目的順序（不在清單裡的排最後）
const STAGES = ['啟蒙', '國小一年級', '國小二年級', '國小三年級', '國小四年級', '國小五年級', '國小六年級'];
const SUBJECTS = ['國語', '數學', '社會', '自然', '英語', '作文'];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const games = GAMES.map(g => ({ ...g, ...g.labels, tagList:g.labels.tags.split(',').filter(Boolean) }));

// 讀每個遊戲裡的 <meta name="edulab:*">（GitHub Pages 允許跨網域讀取）
async function loadMeta(g){
  try {
    const res = await fetch(g.url, { cache:'no-cache' });
    if (!res.ok) return;
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    const m = k => { const el = doc.querySelector(`meta[name="edulab:${k}"]`); return el ? el.content.trim() : ''; };
    ['title', 'stage', 'subject', 'icon', 'desc'].forEach(k => { if (m(k)) g[k] = m(k); });
    if (m('tags')) g.tagList = m('tags').split(/[,，、]/).map(t => t.trim()).filter(Boolean);
  } catch (e) { /* 讀不到就用備用標籤 */ }
}

const rank = (list, v) => { const i = list.indexOf(v); return i < 0 ? list.length : i; };
const hl = (text, q) => { const t = esc(text); if (!q) return t; const i = text.toLowerCase().indexOf(q.toLowerCase()); return i < 0 ? t : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length)); };
// 卡片上只放前三個標籤；搜尋到的標籤會優先顯示
const pickTags = (g, q) => { const hit = q ? g.tagList.filter(t => t.toLowerCase().includes(q.toLowerCase())) : []; return [...new Set([...hit, ...g.tagList])].slice(0, 3); };
const matches = (g, q) => !q || [g.title, g.stage, g.subject, g.desc, ...g.tagList].some(t => t.toLowerCase().includes(q.toLowerCase()));

function render(){
  const q = $('q').value.trim(), by = sortBy;
  const list = games.filter(g => matches(g, q));
  const order = by === 'stage' ? STAGES : SUBJECTS, key = by === 'stage' ? 'stage' : 'subject', sub = by === 'stage' ? 'subject' : 'stage', subOrder = by === 'stage' ? SUBJECTS : STAGES;
  const names = [...new Set([...order, ...games.map(g => g[key])])];
  const groups = names.map(name => ({ name, items:list.filter(g => g[key] === name).sort((a, b) => rank(subOrder, a[sub]) - rank(subOrder, b[sub]) || a.title.localeCompare(b.title, 'zh-Hant')) }));
  const off = hidden[by];
  $('gTitle').textContent = by === 'stage' ? '年級' : '科目';
  $('groups').innerHTML = groups.map(gr => `<li><label><span>${esc(gr.name)}</span><input type="checkbox" data-g="${esc(gr.name)}" ${off.has(gr.name) ? '' : 'checked'}></label></li>`).join('');
  const shown = groups.map((gr, i) => ({ ...gr, i })).filter(gr => gr.items.length && !off.has(gr.name));
  $('main').innerHTML = shown.length ? shown.map(gr => `<section class="group"><h2 id="g${gr.i}">${esc(gr.name)}<span class="n">${gr.items.length}</span></h2>
    <div class="cards">${gr.items.map(g => `<a class="card" href="${esc(g.url)}">
      ${g.pv ? `<div class="pv" data-pv aria-hidden="true">${Array.from({ length:PV_N }, (_, k) => `<img src="previews/${g.pv}/${k + 1}.jpg" alt="" ${k ? 'loading="lazy"' : ''} class="${k ? '' : 'on'}">`).join('')}<div class="dots">${'<i></i>'.repeat(PV_N)}</div></div>` : ''}
      <div class="body"><h3><span class="ico" aria-hidden="true">${esc(g.icon || '🎮')}</span>${hl(g.title, q)}</h3>
      <p>${hl(g.brief || g.desc, q)}</p>
      <div class="chips"><span class="chip stage">${hl(g.stage, q)}</span><span class="chip subject">${hl(g.subject, q)}</span>${pickTags(g, q).map(t => `<span class="chip">${hl(t, q)}</span>`).join('')}</div></div></a>`).join('')}</div></section>`).join('')
    : `<div class="none">${q ? `找不到「${esc(q)}」的遊戲` : '沒有勾選的分組，請在左邊勾選年級或科目'}</div>`;
  try { localStorage.setItem('edulab-portal-sort', by); } catch (e) {}
  $('main').querySelectorAll('[data-pv]').forEach((pv, i) => { pv.dataset.k = 0; pv.dataset.off = i % 3; paintDots(pv); });
}
// 預覽圖輪播：每張卡錯開一點時間換，畫面不會同時跳動；移到卡片上就停在那張
function paintDots(pv){ const k = +pv.dataset.k; pv.querySelectorAll('img').forEach((im, n) => im.classList.toggle('on', n === k)); pv.querySelectorAll('.dots i').forEach((d, n) => d.classList.toggle('on', n === k)); }
if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
  let tick = 0;
  setInterval(() => {
    tick = (tick + 1) % 3;
    document.querySelectorAll('[data-pv]').forEach(pv => {
      if (+pv.dataset.off !== tick || pv.closest('.card:hover')) return;
      const k = (+pv.dataset.k + 1) % PV_N, im = pv.querySelectorAll('img')[k];
      if (!im.complete || !im.naturalWidth){ im.loading = 'eager'; return; }   // 下一張還沒載好就先等，不顯示空白
      pv.dataset.k = k; paintDots(pv);
    });
  }, PV_MS / 3);
}

let sortBy = 'stage';
// 勾掉（不顯示）的分組
const hidden = { stage:new Set(), subject:new Set() };
try { const h = JSON.parse(localStorage.getItem('edulab-portal-hidden') || '{}'); ['stage', 'subject'].forEach(k => { if (Array.isArray(h[k])) hidden[k] = new Set(h[k]); }); } catch (e) {}
const saveHidden = () => { try { localStorage.setItem('edulab-portal-hidden', JSON.stringify({ stage:[...hidden.stage], subject:[...hidden.subject] })); } catch (e) {} };
$('groups').addEventListener('change', e => { const c = e.target.closest('[data-g]'); if (!c) return; if (c.checked) hidden[sortBy].delete(c.dataset.g); else hidden[sortBy].add(c.dataset.g); saveHidden(); render(); });
$('gAll').addEventListener('click', () => { hidden[sortBy].clear(); saveHidden(); render(); });
$('gNone').addEventListener('click', () => { $('groups').querySelectorAll('[data-g]').forEach(c => hidden[sortBy].add(c.dataset.g)); saveHidden(); render(); });
try { const s = localStorage.getItem('edulab-portal-sort'); if (s === 'stage' || s === 'subject') sortBy = s; } catch (e) {}
// 排序方式的下拉選單：點按鈕打開，選了就關起來；按 Esc 或點外面也會關
const menu = $('sortMenu'), btn = $('sortBtn');
function syncSort(){
  $('sortLbl').textContent = sortBy === 'stage' ? '依年級' : '依科目';
  menu.querySelectorAll('li').forEach(li => li.setAttribute('aria-selected', String(li.dataset.v === sortBy)));
}
function openMenu(open){
  menu.hidden = !open; btn.setAttribute('aria-expanded', String(open));
  if (open) (menu.querySelector('[aria-selected="true"]') || menu.firstElementChild).focus();
}
btn.addEventListener('click', () => openMenu(menu.hidden));
menu.addEventListener('click', e => { const li = e.target.closest('li'); if (!li) return; sortBy = li.dataset.v; syncSort(); openMenu(false); btn.focus(); render(); });
menu.addEventListener('keydown', e => {
  const items = [...menu.querySelectorAll('li')], i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown'){ items[(i + 1) % items.length].focus(); e.preventDefault(); }
  else if (e.key === 'ArrowUp'){ items[(i - 1 + items.length) % items.length].focus(); e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === ' '){ document.activeElement.click(); e.preventDefault(); }
  else if (e.key === 'Escape'){ openMenu(false); btn.focus(); }
});
document.addEventListener('click', e => { if (!e.target.closest('#sortbox')) openMenu(false); });
syncSort();
// 從遊戲按「主畫面」回來時，記住是哪個遊戲；上方出現「回到剛才的遊戲」，按 Backspace 或 B 也能回去
const LAST_KEY = 'edulab-last-game';
let last = null;
try {
  const ref = document.referrer, from = ref && games.find(g => ref.startsWith(g.url));
  if (from) localStorage.setItem(LAST_KEY, JSON.stringify({ url:ref, at:Date.now() }));
  last = JSON.parse(localStorage.getItem(LAST_KEY) || 'null');
} catch (e) {}
const lastGame = () => last && Date.now() - last.at < 30 * 60 * 1000 && games.find(g => last.url.startsWith(g.url));
function renderBack(){
  const g = lastGame(); $('back').hidden = !g; if (!g) return;
  $('back').innerHTML = `<a href="${esc(last.url)}" id="backLink">↩ 回到剛才的遊戲：${esc(g.icon || '🎮')} ${esc(g.title)}<small>不小心按到主畫面嗎？點這裡，或按 <kbd>Backspace</kbd> / <kbd>B</kbd></small></a>`;
}
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest('input, textarea, select, [contenteditable]')) return;
  if ((e.key === 'Backspace' || e.key === 'b' || e.key === 'B') && lastGame()){ e.preventDefault(); location.href = last.url; }
});
renderBack();
$('q').addEventListener('input', render);
render();
Promise.all(games.map(loadMeta)).then(() => { render(); renderBack(); });
</script>
</body>
</html>
